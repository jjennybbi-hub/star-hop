<title>Star Hop</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#04060d; --deep:#070b16; --panel:rgba(9,13,24,.82); --panel-solid:#090d18;
  --edge:#1c2540; --edge-soft:rgba(140,165,215,.14);
  --ink:#e7ecf8; --ink-dim:#9aa7c4; --ink-faint:#6b7799;
  --guide:#7fb2ff; --amber:#f4b942; --amber-deep:#b4801f;
  --good:#5ed39b; --warn:#f0883e; --violet:#9d8cff;
  --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:var(--sans);
  --disp:var(--sans);
  --time:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rail:352px;
}
:root[data-vision="night"]{
  --ink:#ffd3c0; --ink-dim:#d09a80; --ink-faint:#8a5f4c;
  --guide:#c4573a; --amber:#ff8a52; --good:#e07a4a; --violet:#d06a44;
  --edge:#3a1a12; --edge-soft:rgba(255,120,80,.16);
  --panel:rgba(18,6,3,.86); --panel-solid:#120603;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums;
  overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
:root[data-vision="night"] #sky{filter:sepia(1) saturate(3.2) hue-rotate(-28deg) brightness(.78)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px}

#app{position:fixed;inset:0;display:block}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.dragging{cursor:grabbing}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 45%,transparent 40%,rgba(0,0,0,.42) 100%)}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;z-index:6}
.brand{pointer-events:auto;display:flex;align-items:baseline;gap:9px;
  padding:7px 13px 8px;border:1px solid var(--edge-soft);border-radius:2px;
  background:var(--panel);backdrop-filter:blur(14px)}
.brand b{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.015em;line-height:1}
.brand span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
.topspace{flex:1}
.tbtn{pointer-events:auto;display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;
  border:1px solid var(--edge-soft);border-radius:2px;background:var(--panel);backdrop-filter:blur(14px);
  color:var(--ink-dim);font-size:12px;letter-spacing:.04em;transition:color .15s,border-color .15s}
.tbtn:hover{color:var(--ink);border-color:rgba(140,165,215,.34)}
.tbtn[aria-pressed="true"]{color:var(--amber);border-color:rgba(244,185,66,.42)}
.tbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
#btn-rail{display:none}

/* ---------- rail ---------- */
#rail{position:absolute;top:0;bottom:0;left:0;width:var(--rail);z-index:5;
  display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(18px);
  border-right:1px solid var(--edge-soft);
  padding-top:calc(62px + env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--edge-soft);flex:0 0 auto}
.tabs button{flex:1;padding:11px 4px 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);border-bottom:2px solid transparent;transition:color .15s}
.tabs button:hover{color:var(--ink-dim)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.panes{flex:1;overflow-y:auto;overscroll-behavior:contain}
.panes::-webkit-scrollbar{width:7px}
.panes::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
.pane{padding:16px 16px 26px}
.pane[hidden]{display:none}

/* ---------- course ---------- */
.kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
.lede{font-size:12.5px;line-height:1.55;color:var(--ink-dim);margin:0 0 16px}
.progbar{height:3px;background:var(--edge);border-radius:2px;overflow:hidden;margin:0 0 4px}
.progbar i{display:block;height:100%;background:var(--amber);transition:width .4s ease}
.progtext{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin:0 0 18px;letter-spacing:.03em}
.tier{margin:0 0 18px}
.tier > h3{font-family:var(--disp);font-weight:600;font-size:16px;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
.tier > h3 em{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber-deep)}
.tier > p{font-size:11.5px;line-height:1.5;color:var(--ink-faint);margin:0 0 9px}
.lessons{display:flex;flex-direction:column;gap:5px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;
  border:1px solid transparent;border-radius:2px;background:rgba(255,255,255,.028);transition:background .15s,border-color .15s}
.lrow:hover{background:rgba(127,178,255,.09);border-color:var(--edge-soft)}
.lrow .dot{flex:0 0 16px;height:16px;border-radius:50%;border:1.5px solid var(--edge);
  display:grid;place-items:center;font-size:9px;color:var(--ink-faint);font-family:var(--mono)}
.lrow.done .dot{background:var(--amber);border-color:var(--amber);color:#1a1205}
.lrow.done .lname{color:var(--ink-dim)}
.lname{flex:1;font-size:13px;line-height:1.35}
.lmins{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.lrow.locked{opacity:.56;cursor:default}
.lrow.locked:hover{background:rgba(255,255,255,.028);border-color:transparent}

#lessonview h2{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1.15;margin:2px 0 7px}
.goal{font-size:11.5px;color:var(--amber);margin:0 0 15px;line-height:1.45}
.stepdots{display:flex;gap:5px;margin:0 0 13px}
.stepdots i{flex:1;height:2px;background:var(--edge);border-radius:2px}
.stepdots i.on{background:var(--amber)}
.stepdots i.past{background:var(--amber-deep)}
.saytext{font-size:14.5px;line-height:1.62;margin:0 0 18px;min-height:112px}
.saytext b{font-weight:600;color:#fff}
:root[data-vision="night"] .saytext b{color:#ffe6d8}
.saytext i{color:var(--ink-dim)}
.navrow{display:flex;gap:8px;align-items:center}
.btn{height:36px;padding:0 15px;border-radius:2px;border:1px solid var(--edge-soft);
  background:rgba(255,255,255,.04);font-size:12.5px;letter-spacing:.03em;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#170f02;font-weight:600}
.btn.primary:hover{background:#ffc960}
.btn.ghost{border-color:transparent;color:var(--ink-faint);padding:0 6px}
.btn.ghost:hover{color:var(--ink-dim);background:none}
.btn[disabled]{opacity:.35;cursor:default}
.spacer{flex:1}

.check{margin-top:16px;padding:14px;border:1px solid rgba(244,185,66,.3);border-radius:2px;
  background:linear-gradient(180deg,rgba(244,185,66,.09),rgba(244,185,66,.03))}
.check .q{font-size:13.5px;line-height:1.5;margin:0 0 11px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;padding:10px 12px;border:1px solid var(--edge-soft);border-radius:2px;
  background:rgba(0,0,0,.28);font-size:13px;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover{border-color:rgba(244,185,66,.5)}
.opt.right{border-color:var(--good);background:rgba(94,211,155,.14)}
.opt.wrong{border-color:#e0674a;background:rgba(224,103,74,.13)}
.findcue{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--amber);
  font-family:var(--mono);letter-spacing:.02em}
.findcue .pulse{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:0 0 auto;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.hint{font-size:11.5px;color:var(--ink-dim);line-height:1.5;margin:10px 0 0;padding-left:11px;
  border-left:2px solid var(--edge)}
.verdict{font-size:13px;line-height:1.5;margin:11px 0 0;font-weight:500}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--warn)}

/* ---------- tonight ---------- */
.nowline{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.02em;
  margin:0 0 14px;line-height:1.6}
.nowline b{color:var(--ink-dim);font-weight:500}
.seclabel{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);
  margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.seclabel::after{content:"";flex:1;height:1px;background:var(--edge)}
.olist{display:flex;flex-direction:column;gap:1px}
.orow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;
  text-align:left;padding:8px 9px;border-radius:2px;transition:background .15s}
.orow:hover{background:rgba(127,178,255,.1)}
.swatch{width:9px;height:9px;border-radius:50%;box-shadow:0 0 7px currentColor}
.oname{font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.oname small{font-size:10.5px;color:var(--ink-faint);letter-spacing:.02em}
.opos{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{font-size:12.5px;color:var(--ink-faint);line-height:1.55;padding:6px 0}
.tip{font-size:11.5px;line-height:1.55;color:var(--ink-dim);margin:16px 0 0;padding:11px 12px;
  border:1px solid var(--edge-soft);border-left:2px solid var(--guide);border-radius:2px;
  background:rgba(127,178,255,.05)}

/* ---------- sky controls ---------- */
.ctlgroup{margin:0 0 4px}
.tog{display:flex;align-items:center;gap:10px;width:100%;padding:8px 2px;text-align:left;font-size:13px}
.tog .sw{flex:0 0 30px;height:17px;border-radius:9px;background:var(--edge);position:relative;transition:background .18s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:var(--ink-faint);transition:transform .18s,background .18s}
.tog[aria-pressed="true"] .sw{background:rgba(244,185,66,.34)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(13px);background:var(--amber)}
.slider{margin:13px 0 15px}
.slider label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin:0 0 7px}
.slider label span{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:16px;-webkit-appearance:none;appearance:none;background:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--edge);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--amber);margin-top:-5.5px;border:none;cursor:pointer}
input[type=range]::-moz-range-track{height:2px;background:var(--edge);border-radius:2px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--amber);border:none;cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:4px}
select,input[type=text],input[type=date],input[type=time]{width:100%;height:34px;padding:0 9px;
  background:rgba(0,0,0,.4);border:1px solid var(--edge-soft);border-radius:2px;color:var(--ink);
  font-size:12.5px;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field{margin:0 0 11px}
.field > span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 6px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.minibtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip{padding:6px 10px;border:1px solid var(--edge-soft);border-radius:2px;font-size:11.5px;
  color:var(--ink-dim);background:rgba(255,255,255,.03);transition:all .15s}
.chip:hover{color:var(--ink);border-color:rgba(140,165,215,.34)}
.chip.on{background:rgba(244,185,66,.16);border-color:rgba(244,185,66,.45);color:var(--amber)}

/* ---------- bottom console ---------- */
#console{position:absolute;left:var(--rail);right:0;bottom:0;z-index:5;display:flex;align-items:center;
  gap:14px;padding:9px 16px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(4,6,13,.93),rgba(4,6,13,.55) 70%,transparent);
  backdrop-filter:blur(8px)}
.clock{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;font-variant-numeric:tabular-nums;
  white-space:nowrap;line-height:1.35}
.clock small{display:block;font-size:10px;color:var(--ink-faint);letter-spacing:.06em}
.tbar{display:flex;align-items:center;gap:4px}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--edge-soft);
  border-radius:2px;background:rgba(255,255,255,.04);color:var(--ink-dim);transition:all .15s}
.ibtn:hover{color:var(--ink);background:rgba(255,255,255,.1)}
.ibtn[aria-pressed="true"]{color:var(--amber);border-color:rgba(244,185,66,.42)}
.ibtn svg{width:13px;height:13px;fill:currentColor}
.speedsel{width:auto;min-width:104px;height:32px;font-family:var(--mono);font-size:11px;padding-right:26px}
.look{margin-left:auto;min-width:0;font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:12px}
#ro-place{overflow:hidden;text-overflow:ellipsis;max-width:150px;flex:0 1 auto}
.look b{color:var(--ink-dim);font-weight:400}

/* ---------- info card ---------- */
#infocard{position:absolute;right:16px;top:64px;top:calc(64px + env(safe-area-inset-top,0px));
  width:298px;z-index:7;padding:15px 16px 16px;border:1px solid var(--edge-soft);border-radius:2px;
  background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 18px 44px rgba(0,0,0,.6)}
#infocard[hidden]{display:none}
#infocard .x{position:absolute;top:9px;right:9px;width:24px;height:24px;display:grid;place-items:center;
  color:var(--ink-faint);font-size:15px;line-height:1}
#infocard .x:hover{color:var(--ink)}
.iname{font-family:var(--disp);font-weight:600;font-size:21px;line-height:1.1;margin:0 0 3px;padding-right:22px}
.ibayer{font-size:11px;color:var(--ink-faint);letter-spacing:.09em;text-transform:uppercase;margin:0 0 13px}
.idata{display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:11.5px;margin:0 0 12px}
.idata dt{color:var(--ink-faint);letter-spacing:.04em}
.idata dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.inote{font-size:12.5px;line-height:1.6;color:var(--ink);border-top:1px solid var(--edge);padding-top:11px;margin:0}
.ivis{margin:11px 0 0;font-size:11.5px;color:var(--good);line-height:1.45}
.ivis.no{color:var(--ink-faint)}

/* ---------- search ---------- */
#searchwrap{position:absolute;top:60px;top:calc(60px + env(safe-area-inset-top,0px));left:50%;
  transform:translateX(-50%);width:min(420px,calc(100vw - 32px));z-index:9}
#searchwrap[hidden]{display:none}
#searchbox{width:100%;height:42px;font-size:14px;background:var(--panel-solid);
  border:1px solid rgba(244,185,66,.4);box-shadow:0 14px 40px rgba(0,0,0,.65)}
#results{margin-top:5px;background:var(--panel-solid);border:1px solid var(--edge-soft);
  max-height:46vh;overflow-y:auto;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#results button{display:flex;width:100%;gap:10px;align-items:baseline;padding:9px 12px;text-align:left;font-size:13px}
#results button:hover,#results button.sel{background:rgba(127,178,255,.13)}
#results small{color:var(--ink-faint);font-size:10.5px;margin-left:auto;font-family:var(--mono)}

#toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:8;
  padding:9px 16px;border-radius:2px;background:rgba(9,13,24,.94);border:1px solid var(--edge-soft);
  font-size:12.5px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;
  max-width:min(440px,90vw);text-align:center;line-height:1.45}
#toast[hidden]{display:none}


/* ---------- pronunciation, schedule, tour ---------- */
.isay{display:flex;flex-direction:column;gap:2px;margin:0 0 6px;font-size:11.5px;color:var(--ink-dim);line-height:1.45}
.isay .pron{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.04em}
.isched{margin:6px 0 0;font-size:11.5px;color:var(--ink-dim);font-family:var(--mono);line-height:1.5;
  font-variant-numeric:tabular-nums}
.sched{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 6px;font-size:11.5px}
.sched dt{color:var(--ink-faint)}
.sched dd{margin:0;font-family:var(--mono);color:var(--ink-dim);font-variant-numeric:tabular-nums}
.tourcard{margin:0 0 20px;padding:15px 15px 16px;border:1px solid rgba(244,185,66,.34);border-radius:2px;
  background:radial-gradient(120% 140% at 100% 0%,rgba(244,185,66,.16),rgba(244,185,66,.03) 60%)}
.tourcard h3{font-family:var(--disp);font-weight:600;font-size:20px;margin:0 0 6px}
.tourcard p:not(.kicker){font-size:12.5px;line-height:1.55;color:var(--ink-dim);margin:0 0 13px}
.tourtitle{font-family:var(--disp);font-weight:600;font-size:24px;line-height:1.1;margin:4px 0 10px}
.bigdir{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.bigdir span{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);
  padding:6px 10px;border:1px solid rgba(244,185,66,.4);border-radius:2px;background:rgba(244,185,66,.07)}
.banner{display:flex;flex-direction:column;gap:9px;align-items:flex-start;margin:0 0 16px;padding:11px 12px;
  font-size:12px;line-height:1.5;color:var(--ink-dim);border:1px solid var(--edge-soft);border-left:2px solid var(--warn);
  border-radius:2px;background:rgba(240,136,62,.06)}
.saytext b{white-space:normal}


/* ---------- location chip, live clock, popovers ---------- */
.placechip{max-width:260px}
.placechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placechip.away{color:var(--amber);border-color:rgba(244,185,66,.42)}
button.clock{text-align:left;padding:4px 8px;margin-left:-8px;border-radius:2px;border:1px solid transparent;transition:border-color .15s,background .15s}
button.clock:hover{border-color:var(--edge-soft);background:rgba(255,255,255,.04)}
.clockrow{display:flex;align-items:center;gap:8px}
.livebadge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.14em;color:#ff7a5c;font-weight:500}
.livebadge i,.livebtn i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s ease-in-out infinite}
.livebtn{width:auto!important;padding:0 11px;gap:6px;display:flex!important;align-items:center;font-size:11px;font-family:var(--mono);letter-spacing:.06em}
.livebtn i{animation:none;opacity:.45;background:var(--ink-faint)}
.livebtn[aria-pressed="true"]{color:#ff7a5c;border-color:rgba(255,122,92,.5)}
.livebtn[aria-pressed="true"] i{animation:pulse 1.8s ease-in-out infinite;opacity:1;background:#ff7a5c}
.pop{position:absolute;z-index:9;background:var(--panel-solid);border:1px solid var(--edge-soft);border-radius:2px;
  box-shadow:0 18px 48px rgba(0,0,0,.7);padding:13px 14px 12px}
.pop[hidden]{display:none}
.pophead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.pophead b{font-family:var(--disp);font-weight:600;font-size:17px}
.pophead span{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-right:auto}

      <button class="ibtn" id="btn-measure" aria-pressed="false" title="Ruler: click two stars to measure the gap (R)" style="width:auto;padding:0 10px;gap:6px;display:flex;align-items:center;font-size:11px;font-family:var(--mono)">
        <svg viewBox="0 0 14 14" style="width:14px;height:14px"><path d="M1 10.5L10.5 1 13 3.5 3.5 13z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 7.5l1.3 1.3M6 5.5l1.8 1.8M8 3.5l1.3 1.3" stroke="currentColor" stroke-width="1.1"/></svg>RULER</button>
    </div>
    <div class="look">
      <span>facing <b id="ro-dir">—</b></span>
      <span>alt <b id="ro-alt">—</b></span>
      <span>field <b id="ro-fov">—</b></span>
    </div>
  </footer>
